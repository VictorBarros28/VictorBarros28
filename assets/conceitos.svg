.i{font-size:13.5px;fill:#9da7b3}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c0{opacity:0;animation:in .6s ease-out 0.00s forwards}.c1{opacity:0;animation:in .6s ease-out 0.12s forwards}.c2{opacity:0;animation:in .6s ease-out 0.24s forwards}.c3{opacity:0;animation:in .6s ease-out 0.36s forwards}.c4{opacity:0;animation:in .6s ease-out 0.48s forwards}.c5{opacity:0;animation:in .6s ease-out 0.60s forwards}
